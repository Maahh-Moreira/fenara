name: Verificação FENARA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install
      - name: TypeScript
        run: npm run typecheck
      - name: Testes unitários
        run: npm test
        env:
          NEXT_PUBLIC_PORTFOLIO_DEMO: 'true'
